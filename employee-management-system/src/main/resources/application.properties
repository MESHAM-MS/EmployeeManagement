spring.application.name=employee-management-system
server.port=8080

# ---- MySQL (override with environment variables if needed) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:XXXXXX}
spring.datasource.password=${DB_PASSWORD:YYYYYYYY}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Return clean errors for malformed requests / unknown URLs
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
